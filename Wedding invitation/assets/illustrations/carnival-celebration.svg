<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="sunlitGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFDF0" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FFF2DC" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#FDE8EA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F5F9F4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carnivalPeach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBE76"/>
      <stop offset="100%" stop-color="#F0932B"/>
    </linearGradient>
    <linearGradient id="carnivalPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9FF3"/>
      <stop offset="100%" stop-color="#F368E0"/>
    </linearGradient>
    <linearGradient id="mintGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8E6CF"/>
      <stop offset="100%" stop-color="#55E6C1"/>
    </linearGradient>
    <linearGradient id="lemonYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FECA57"/>
      <stop offset="100%" stop-color="#FF9F43"/>
    </linearGradient>
    <filter id="festiveGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sunlit Garden Aura -->
  <circle cx="250" cy="220" r="220" fill="url(#sunlitGlow)"/>

  <!-- Carnival Garden Canopy / Pastel Striped Cabana Roof at Top -->
  <g id="cabanaCanopy" transform="translate(250, 60)">
    <!-- Scalloped Bunting Flags -->
    <path d="M-220,10 Q-150,40 -80,10 Q0,40 80,10 Q150,40 220,10" stroke="#DFE6E9" stroke-width="2" fill="none"/>
    <!-- Triangular Pennant Flags in Festive Pastels -->
    <polygon points="-210,12 -190,45 -170,14" fill="#FF9FF3"/>
    <polygon points="-160,16 -140,50 -120,20" fill="#FECA57"/>
    <polygon points="-110,22 -90,52 -70,24" fill="#55E6C1"/>
    <polygon points="-60,26 -40,54 -20,28" fill="#FFBE76"/>
    <polygon points="-10,28 10,55 30,28" fill="#FF7675"/>
    <polygon points="40,27 60,54 80,25" fill="#55E6C1"/>
    <polygon points="90,23 110,51 130,20" fill="#FECA57"/>
    <polygon points="140,18 160,48 180,14" fill="#FF9FF3"/>
    <polygon points="190,12 210,40 225,10" fill="#FFBE76"/>
  </g>

  <!-- Garden Florals & Foliage Background -->
  <g opacity="0.6">
    <!-- Palm / Monstera Fronds in Muted Greens -->
    <path d="M50,150 C70,120 120,130 110,170 C90,180 60,180 50,150 Z" fill="url(#mintGreen)"/>
    <path d="M450,150 C430,120 380,130 390,170 C410,180 440,180 450,150 Z" fill="url(#mintGreen)"/>
    <!-- Hanging Floral Clusters -->
    <circle cx="80" cy="110" r="14" fill="#FF9FF3" opacity="0.5"/>
    <circle cx="95" cy="120" r="12" fill="#FECA57" opacity="0.5"/>
    <circle cx="420" cy="110" r="14" fill="#FF9FF3" opacity="0.5"/>
    <circle cx="405" cy="120" r="12" fill="#FECA57" opacity="0.5"/>
  </g>

  <!-- The Couple: Kunal & Sonal in Joyful Carnival Chic Style -->
  <g id="carnivalCouple" transform="translate(250, 310)">
    <!-- Shadow -->
    <ellipse cx="0" cy="125" rx="85" ry="12" fill="#4B6584" opacity="0.12"/>

    <!-- GROOM (KUNAL) - Stylish Pastel Linen Kurta / Bandhgala & Sunglasses -->
    <g transform="translate(-40, -5)">
      <!-- Linen Trousers -->
      <path d="M-22,50 L-25,122 L-10,122 L-8,50 Z" fill="#F8EFBA"/>
      <path d="M-5,50 L-3,122 L12,122 L8,50 Z" fill="#F8EFBA"/>

      <!-- Mint / Peach Stylish Kurta with Rolled-up Sleeves -->
      <path d="M-26,-20 C-26,-28 -8,-32 0,-32 C8,-32 20,-25 20,-20 L16,55 L-22,55 Z" fill="#78E08F"/>
      <!-- Nehru Collar & Gold Buttons -->
      <path d="M-10,-32 C-10,-38 2,-38 2,-32 Z" fill="#55E6C1"/>
      <circle cx="-4" cy="-20" r="1.5" fill="#F39C12"/>
      <circle cx="-4" cy="-10" r="1.5" fill="#F39C12"/>
      <circle cx="-4" cy="0" r="1.5" fill="#F39C12"/>

      <!-- Arm raised tossing flower petals -->
      <path d="M-24,-15 C-45,-30 -50,-50 -42,-65" stroke="#78E08F" stroke-width="10" stroke-linecap="round" fill="none"/>
      <!-- Hand throwing petals -->
      <circle cx="-40" cy="-68" r="5" fill="#F7D0B7"/>

      <!-- Groom Head with Modern Haircut & Sunglasses -->
      <ellipse cx="-4" cy="-56" rx="13" ry="16" fill="#F7D0B7"/>
      <!-- Neat styled hair -->
      <path d="M-16,-62 C-16,-74 2,-74 10,-68 C0,-68 -8,-62 -8,-52 Z" fill="#2C1D11"/>
      <!-- Cool Wayfarer / Aviator Sunglasses -->
      <rect x="-14" y="-58" width="9" height="6" rx="2" fill="#2C3A47"/>
      <rect x="-2" y="-58" width="9" height="6" rx="2" fill="#2C3A47"/>
      <line x1="-5" y1="-56" x2="-2" y2="-56" stroke="#D4AF37" stroke-width="1.5"/>
      <!-- Joyful Smile -->
      <path d="M-8,-45 Q-4,-40 0,-45" stroke="#8A4E2C" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </g>

    <!-- BRIDE (SONAL) - Chic Floral Tiered Midi / Pastel Lehenga & Flowers in Hair -->
    <g transform="translate(40, 0)">
      <!-- Tiered Pastel Coral & Yellow Skirt with Flounce -->
      <path d="M-18,35 L-40,122 C-40,126 35,126 35,122 L10,35 Z" fill="#FF7675"/>
      <!-- Tier 1 Frill -->
      <path d="M-25,65 Q-5,60 18,65" stroke="#FECA57" stroke-width="3" fill="none"/>
      <!-- Tier 2 Frill -->
      <path d="M-34,95 Q-5,90 28,95" stroke="#FF9FF3" stroke-width="3" fill="none"/>
      <!-- Hem Frill -->
      <path d="M-40,120 Q-5,115 35,120" stroke="#FFF" stroke-width="3" fill="none"/>

      <!-- Stylish Sleeveless Crop Top / Blouse -->
      <path d="M-15,-15 C-15,-25 0,-28 10,-25 L12,35 L-14,35 Z" fill="#FECA57"/>

      <!-- Bride Raised Hand with Flower Glass / Petals -->
      <path d="M10,-12 C30,-25 40,-45 35,-60" stroke="#FCE2CE" stroke-width="7" stroke-linecap="round" fill="none"/>
      <!-- Hand holding fresh floral cocktail glass with umbrella -->
      <circle cx="34" cy="-64" r="4" fill="#FCE2CE"/>
      <polygon points="34,-64 28,-78 42,-78" fill="#55E6C1" opacity="0.8"/>
      <polygon points="22,-85 35,-78 48,-85" fill="#FF7675"/>

      <!-- Bride Head with Radiant Laughing Expression -->
      <ellipse cx="-2" cy="-52" rx="12" ry="14" fill="#FCE2CE"/>
      <!-- Cascading Soft Curls / Hair with Floral Tiara -->
      <path d="M-12,-58 C-10,-72 8,-70 12,-58 C16,-45 16,-20 18,-5 Z" fill="#241408"/>
      <!-- Flower Crown in Hair -->
      <circle cx="-4" cy="-64" r="3.5" fill="#FF7675"/>
      <circle cx="2" cy="-66" r="3.5" fill="#FECA57"/>
      <circle cx="8" cy="-64" r="3.5" fill="#55E6C1"/>
      <circle cx="13" cy="-60" r="3" fill="#FF9FF3"/>
      <!-- Bride Sunglasses perched stylishly on top / eyes sparkling -->
      <path d="M-8,-54 Q-5,-50 -2,-54" stroke="#8A4E2C" stroke-width="1.8" fill="none"/>
      <path d="M2,-54 Q5,-50 8,-54" stroke="#8A4E2C" stroke-width="1.8" fill="none"/>
      <!-- Radiant Smile -->
      <path d="M-6,-43 Q0,-37 6,-43" stroke="#D63031" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Shower of Floating Petals, Confetti & Sparkles -->
  <g id="carnivalPetals" filter="url(#festiveGlow)">
    <!-- Rose & Marigold Floating Petals -->
    <path d="M160,180 C150,170 160,155 170,165 C180,175 170,190 160,180 Z" fill="#FF7675" opacity="0.85"/>
    <path d="M320,160 C310,150 320,135 330,145 C340,155 330,170 320,160 Z" fill="#FECA57" opacity="0.85"/>
    <path d="M220,140 C210,130 220,115 230,125 C240,135 230,150 220,140 Z" fill="#FF9FF3" opacity="0.85"/>
    <path d="M280,130 C270,120 280,105 290,115 C300,125 290,140 280,130 Z" fill="#55E6C1" opacity="0.8"/>
    <path d="M120,240 C110,230 120,215 130,225 C140,235 130,250 120,240 Z" fill="#FFBE76" opacity="0.85"/>
    <path d="M380,230 C370,220 380,205 390,215 C400,225 390,240 380,230 Z" fill="#FF7675" opacity="0.85"/>
    
    <!-- Gold & Pastel Confetti Spirals & Dots -->
    <rect x="180" y="210" width="8" height="3" rx="1" transform="rotate(25, 180, 210)" fill="#FECA57"/>
    <rect x="290" y="190" width="8" height="3" rx="1" transform="rotate(-35, 290, 190)" fill="#FF9FF3"/>
    <rect x="250" y="170" width="6" height="3" rx="1" transform="rotate(45, 250, 170)" fill="#55E6C1"/>
    <rect x="340" y="260" width="7" height="3" rx="1" transform="rotate(15, 340, 260)" fill="#FF7675"/>
    <circle cx="210" cy="180" r="2.5" fill="#FFD32A"/>
    <circle cx="270" cy="220" r="2.5" fill="#FF6B81"/>
    <circle cx="150" cy="290" r="2" fill="#55E6C1"/>
    <circle cx="350" cy="310" r="2.5" fill="#FECA57"/>
  </g>
</svg>
