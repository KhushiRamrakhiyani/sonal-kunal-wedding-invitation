<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="havanAura" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FFF3D6" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FCE1AE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FAF1D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E17055"/>
      <stop offset="50%" stop-color="#F39C12"/>
      <stop offset="100%" stop-color="#F1C40F"/>
    </linearGradient>
    <linearGradient id="janeuGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0BE"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9C7A14"/>
    </linearGradient>
    <linearGradient id="copperKund" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D35400"/>
      <stop offset="50%" stop-color="#A04000"/>
      <stop offset="100%" stop-color="#6E2C00"/>
    </linearGradient>
    <filter id="flameGlow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura of the Holy Havan Fire -->
  <circle cx="250" cy="280" r="190" fill="url(#havanAura)"/>

  <!-- Subtle Nirankar Sacred Light Rays at Top -->
  <g opacity="0.3" stroke="url(#janeuGold)" stroke-width="1">
    <line x1="250" y1="40" x2="250" y2="100"/>
    <line x1="200" y1="50" x2="215" y2="105"/>
    <line x1="300" y1="50" x2="285" y2="105"/>
    <line x1="150" y1="70" x2="180" y2="115"/>
    <line x1="350" y1="70" x2="320" y2="115"/>
  </g>

  <!-- Sacred Janeu Thread (Yagnopavita) Loop suspended in Grace -->
  <g id="sacredJaneu" transform="translate(250, 130)">
    <!-- Golden radiant circle halo behind Janeu -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#janeuGold)" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.8"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="url(#janeuGold)" stroke-width="0.6" opacity="0.5"/>
    
    <!-- Three Sacred Strands of Janeu (representing Gayatri, Truth, Dharma) -->
    <!-- Strand 1 -->
    <path d="M-30,-25 C-45,15 -15,45 0,42 C15,45 45,15 30,-25 C15,-45 -15,-45 -30,-25 Z" 
          fill="none" stroke="#FFFBF0" stroke-width="2.5" opacity="0.95"/>
    <!-- Strand 2 -->
    <path d="M-28,-22 C-42,15 -12,42 0,39 C12,42 42,15 28,-22 C12,-42 -12,-42 -28,-22 Z" 
          fill="none" stroke="url(#janeuGold)" stroke-width="1.8"/>
    <!-- Strand 3 -->
    <path d="M-26,-20 C-38,12 -10,38 0,36 C10,38 38,12 26,-20 C10,-38 -10,-38 -26,-20 Z" 
          fill="none" stroke="#FCE8B2" stroke-width="1.5"/>

    <!-- Sacred Brahmaganthi (Knot of Brahma) -->
    <circle cx="0" cy="40" r="5" fill="url(#janeuGold)"/>
    <circle cx="0" cy="40" r="2.5" fill="#C0392B"/>
    <!-- Yellow turmeric & kumkum accent on the Janeu knot -->
    <circle cx="-5" cy="38" r="2" fill="#F1C40F"/>
    <circle cx="5" cy="38" r="2" fill="#E74C3C"/>
  </g>

  <!-- Holy Kalash with Mango Leaves & Coconut (Left Side) -->
  <g id="sacredKalash" transform="translate(130, 290)">
    <!-- Copper Kalash Pot -->
    <path d="M-18,30 C-22,15 -18,0 -14,-5 L14,-5 C18,0 22,15 18,30 Z" fill="url(#copperKund)"/>
    <!-- Kalash Rim -->
    <ellipse cx="0" cy="-5" rx="14" ry="4" fill="url(#janeuGold)"/>
    <!-- Red Mauli thread tied around kalash neck -->
    <line x1="-13" y1="2" x2="13" y2="2" stroke="#E74C3C" stroke-width="2"/>
    <line x1="-14" y1="5" x2="14" y2="5" stroke="#F1C40F" stroke-width="1.5"/>
    
    <!-- 5 Mango Leaves (Amra Pallav) -->
    <path d="M-12,-6 C-22,-22 -14,-32 -8,-12 Z" fill="#27AE60"/>
    <path d="M-6,-8 C-10,-30 0,-38 0,-12 Z" fill="#2ECC71"/>
    <path d="M0,-8 C0,-35 8,-38 2,-12 Z" fill="#27AE60"/>
    <path d="M6,-8 C10,-30 0,-38 0,-12 Z" fill="#2ECC71"/>
    <path d="M12,-6 C22,-22 14,-32 8,-12 Z" fill="#27AE60"/>

    <!-- Sacred Coconut (Shripal) placed on top -->
    <ellipse cx="0" cy="-22" rx="10" ry="12" fill="#784212"/>
    <!-- Tilak on Coconut -->
    <circle cx="0" cy="-24" r="2.5" fill="#E74C3C"/>
  </g>

  <!-- Vedic Havan Kund (Sacred Fire Altar) in Center -->
  <g id="havanKund" transform="translate(250, 340)">
    <!-- Tiered Copper Havan Pyramidal Base -->
    <!-- Bottom Tier -->
    <polygon points="-90,45 90,45 75,25 -75,25" fill="url(#copperKund)"/>
    <!-- Middle Tier -->
    <polygon points="-70,25 70,25 55,5 -55,5" fill="#A04000"/>
    <!-- Top Step / Rim of Kund -->
    <polygon points="-52,5 52,5 40,-15 -40,-15" fill="url(#copperKund)"/>
    <rect x="-42" y="-18" width="84" height="4" fill="url(#janeuGold)"/>

    <!-- Sacred Woods (Samidha) inside Kund -->
    <rect x="-25" y="-14" width="50" height="5" transform="rotate(-15)" fill="#512E11"/>
    <rect x="-25" y="-14" width="50" height="5" transform="rotate(15)" fill="#512E11"/>

    <!-- Holy Agni (Sacred Fire Flames) with Ethereal Glow -->
    <g filter="url(#flameGlow)">
      <!-- Outer Flame -->
      <path d="M-22,-14 C-25,-40 -12,-65 0,-85 C12,-65 25,-40 22,-14 C15,-8 -15,-8 -22,-14 Z" fill="url(#fireGrad)"/>
      <!-- Inner Flame Core -->
      <path d="M-12,-14 C-15,-32 -6,-52 0,-68 C6,-52 15,-32 12,-14 Z" fill="#FFF275"/>
      <!-- Small Dancing Spark Flames -->
      <path d="M-18,-30 Q-28,-50 -20,-60 Q-15,-48 -14,-32 Z" fill="#F39C12"/>
      <path d="M16,-30 Q25,-50 20,-60 Q15,-48 14,-32 Z" fill="#F39C12"/>
      <circle cx="2" cy="-90" r="2" fill="#F1C40F"/>
      <circle cx="-8" cy="-80" r="1.5" fill="#F39C12"/>
      <circle cx="10" cy="-75" r="1.5" fill="#E67E22"/>
    </g>
  </g>

  <!-- Brass Diya / Deepam (Right Side) -->
  <g transform="translate(370, 290)">
    <path d="M-18,30 C-22,15 -18,0 -14,-5 L14,-5 C18,0 22,15 18,30 Z" fill="url(#janeuGold)"/>
    <ellipse cx="0" cy="-5" rx="14" ry="4" fill="url(#janeuGold)"/>
    <!-- Deepam Flame -->
    <path d="M-4,-7 Q0,-24 0,-26 Q0,-24 4,-7 Z" fill="#E74C3C" filter="url(#flameGlow)"/>
    <path d="M-2,-7 Q0,-18 0,-20 Q0,-18 2,-7 Z" fill="#F9E79F"/>
    <circle cx="0" cy="-16" r="12" fill="#FDF2E9" opacity="0.3"/>
  </g>

  <!-- Marigold Garlands draping bottom of scene -->
  <path d="M60,420 Q250,470 440,420" stroke="url(#fireGrad)" stroke-width="4" stroke-dasharray="8,6" fill="none"/>
  <g fill="#F39C12">
    <circle cx="100" cy="425" r="7"/>
    <circle cx="160" cy="437" r="7"/>
    <circle cx="220" cy="445" r="7"/>
    <circle cx="280" cy="445" r="7"/>
    <circle cx="340" cy="437" r="7"/>
    <circle cx="400" cy="425" r="7"/>
  </g>
  <g fill="#F1C40F">
    <circle cx="130" cy="432" r="6"/>
    <circle cx="190" cy="442" r="6"/>
    <circle cx="250" cy="446" r="6"/>
    <circle cx="310" cy="442" r="6"/>
    <circle cx="370" cy="432" r="6"/>
  </g>
</svg>
