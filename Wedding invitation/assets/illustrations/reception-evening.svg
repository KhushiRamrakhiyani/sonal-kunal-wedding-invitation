<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- White Luxury Pearl Atmosphere -->
    <radialGradient id="pearlNightGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1A2530" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0F171E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070B0E" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="champagneGoldRec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF2"/>
      <stop offset="40%" stop-color="#EAD292"/>
      <stop offset="80%" stop-color="#B89B48"/>
      <stop offset="100%" stop-color="#7B611C"/>
    </linearGradient>
    <linearGradient id="pearlWhiteGown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F7F9FB"/>
      <stop offset="100%" stop-color="#D9E2EC"/>
    </linearGradient>
    <linearGradient id="blackTux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242B33"/>
      <stop offset="70%" stop-color="#0E1217"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>
    <filter id="fairyLightBlur">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Twilight Backdrop -->
  <rect x="0" y="0" width="500" height="500" rx="16" fill="url(#pearlNightGlow)"/>

  <!-- Fairy Light Canopy Ceiling (Droplets of Warm Light) -->
  <g id="fairyLightsCeiling" opacity="0.85">
    <!-- Strings of Warm Glow Lights hanging down in gentle curves -->
    <path d="M0,30 Q125,70 250,40 Q375,70 500,30" stroke="#FFEAA7" stroke-width="0.8" fill="none" opacity="0.4"/>
    <path d="M0,60 Q125,110 250,75 Q375,110 500,60" stroke="#FFEAA7" stroke-width="0.8" fill="none" opacity="0.4"/>
    <path d="M0,90 Q125,150 250,110 Q375,150 500,90" stroke="#FFEAA7" stroke-width="0.8" fill="none" opacity="0.4"/>

    <!-- Glowing Fairy Light Bulbs with Bloom -->
    <g filter="url(#fairyLightBlur)">
      <circle cx="40" cy="42" r="3" fill="#FFFBE6"/>
      <circle cx="100" cy="58" r="3.5" fill="#FFF2B2"/>
      <circle cx="160" cy="62" r="3" fill="#FFFBE6"/>
      <circle cx="220" cy="50" r="3.5" fill="#FFF2B2"/>
      <circle cx="280" cy="52" r="3" fill="#FFFBE6"/>
      <circle cx="340" cy="63" r="3.5" fill="#FFF2B2"/>
      <circle cx="400" cy="56" r="3" fill="#FFFBE6"/>
      <circle cx="460" cy="38" r="3.5" fill="#FFF2B2"/>

      <circle cx="70" cy="88" r="3" fill="#FFFBE6"/>
      <circle cx="130" cy="102" r="3.5" fill="#FFF2B2"/>
      <circle cx="190" cy="98" r="3" fill="#FFFBE6"/>
      <circle cx="250" cy="80" r="4" fill="#FFFFFF"/>
      <circle cx="310" cy="100" r="3" fill="#FFFBE6"/>
      <circle cx="370" cy="102" r="3.5" fill="#FFF2B2"/>
      <circle cx="430" cy="82" r="3" fill="#FFFBE6"/>

      <circle cx="100" cy="135" r="3" fill="#FFF2B2"/>
      <circle cx="220" cy="130" r="3.5" fill="#FFFBE6"/>
      <circle cx="280" cy="132" r="3.5" fill="#FFFBE6"/>
      <circle cx="400" cy="135" r="3" fill="#FFF2B2"/>
    </g>
  </g>

  <!-- Cascading White Peonies, Orchids & Baby's Breath Floral Chandelier on Top -->
  <g transform="translate(250, 65)">
    <!-- Central Crystal & Floral Ring -->
    <ellipse cx="0" cy="15" rx="55" ry="12" fill="none" stroke="url(#champagneGoldRec)" stroke-width="1.5"/>
    <!-- White Floral Blooms -->
    <circle cx="-40" cy="15" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="-20" cy="18" r="10" fill="#FDFBF7"/>
    <circle cx="0" cy="20" r="11" fill="#FFFFFF"/>
    <circle cx="20" cy="18" r="10" fill="#FDFBF7"/>
    <circle cx="40" cy="15" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="-10" cy="10" r="7" fill="#F5F7FA"/>
    <circle cx="10" cy="10" r="7" fill="#F5F7FA"/>
    <!-- Crystal Droplets -->
    <line x1="-30" y1="22" x2="-30" y2="45" stroke="url(#champagneGoldRec)" stroke-width="0.8"/>
    <circle cx="-30" cy="45" r="2" fill="#FFFFFF"/>
    <line x1="0" y1="28" x2="0" y2="55" stroke="url(#champagneGoldRec)" stroke-width="0.8"/>
    <polygon points="0,55 -3,62 0,66 3,62" fill="url(#champagneGoldRec)"/>
    <line x1="30" y1="22" x2="30" y2="45" stroke="url(#champagneGoldRec)" stroke-width="0.8"/>
    <circle cx="30" cy="45" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Sophisticated Couple: Kunal & Sonal in Romantic First Dance Pose -->
  <g id="receptionCouple" transform="translate(250, 315)">
    <!-- Circular Dance Floor Mirror Gloss Reflection Shadow -->
    <ellipse cx="0" cy="120" rx="90" ry="14" fill="#030406" opacity="0.8"/>
    <ellipse cx="0" cy="120" rx="75" ry="10" fill="#1A2530" opacity="0.4"/>

    <!-- GROOM (KUNAL) - Classic Black Tie Satin Tuxedo with Bowtie -->
    <g transform="translate(-36, -5)">
      <!-- Tuxedo Trousers with Satin Side Stripe -->
      <path d="M-20,45 L-24,118 L-8,118 L-6,45 Z" fill="url(#blackTux)"/>
      <path d="M-4,45 L-2,118 L14,118 L10,45 Z" fill="url(#blackTux)"/>
      <!-- Satin stripe -->
      <line x1="-20" y1="45" x2="-24" y2="118" stroke="#3A4654" stroke-width="1"/>
      <line x1="10" y1="45" x2="14" y2="118" stroke="#3A4654" stroke-width="1"/>
      <!-- Patent Leather Shoes -->
      <path d="M-26,118 C-28,122 -8,122 -8,118 Z" fill="#000000"/>
      <path d="M-4,118 C-2,122 16,122 14,118 Z" fill="#000000"/>

      <!-- Tuxedo Jacket (Peak Lapels) & Crisp White Shirt -->
      <path d="M-25,-22 C-25,-32 -6,-34 0,-34 C8,-34 22,-26 22,-22 L18,48 L-22,48 Z" fill="url(#blackTux)"/>
      <!-- White Shirt V-Shape -->
      <polygon points="-6,-34 6,-34 0,-8" fill="#FFFFFF"/>
      <!-- Black Silk Bowtie -->
      <polygon points="-6,-32 -1,-28 -6,-24" fill="#000000"/>
      <polygon points="6,-32 1,-28 6,-24" fill="#000000"/>
      <circle cx="0" cy="-28" r="1.5" fill="#000000"/>
      <!-- White Pocket Square & Boutonniere (White Rose) -->
      <polygon points="-16,-18 -12,-24 -8,-18" fill="#FFFFFF"/>
      <circle cx="-12" cy="-14" r="2" fill="#FFFFFF"/>

      <!-- Groom's Arm Tenderly Holding Bride's Waist in Dance -->
      <path d="M18,-15 C30,-5 36,12 32,25" stroke="url(#blackTux)" stroke-width="9" stroke-linecap="round" fill="none"/>
      <!-- Left Hand Gently Holding Bride's Hand -->
      <path d="M-22,-15 C-35,0 -40,20 -35,32" stroke="url(#blackTux)" stroke-width="8" stroke-linecap="round" fill="none"/>
      <circle cx="-35" cy="34" r="4.5" fill="#F7D0B7"/>

      <!-- Groom Head & Loving Look at Bride -->
      <ellipse cx="-2" cy="-58" rx="13" ry="16" fill="#F7D0B7"/>
      <!-- Groom Hair -->
      <path d="M-15,-66 C-14,-78 4,-76 12,-70 C2,-70 -6,-64 -6,-54 Z" fill="#150E07"/>
      <!-- Groom Beard -->
      <path d="M-14,-56 C-14,-48 -7,-42 0,-42 C7,-42 12,-48 12,-56 C8,-46 0,-46 -2,-46 C-7,-46 -12,-48 -14,-56 Z" fill="#150E07"/>
    </g>

    <!-- BRIDE (SONAL) - Glamorous Pearl White / Ivory Designer Ballgown / Gown -->
    <g transform="translate(38, 0)">
      <!-- Sweeping Ballgown Skirt with Layers of Tulle & Shimmer -->
      <path d="M-16,35 C-25,65 -45,95 -60,118 C-60,123 48,123 48,118 C35,95 22,65 16,35 Z" fill="url(#pearlWhiteGown)"/>
      <!-- Delicate Silver & Gold Threadwork / Shimmer Lines -->
      <g stroke="url(#champagneGoldRec)" stroke-width="0.8" opacity="0.6">
        <path d="M-25,60 Q-2,55 22,60" fill="none"/>
        <path d="M-36,80 Q-2,75 32,80" fill="none"/>
        <path d="M-48,100 Q-2,95 40,100" fill="none"/>
        <path d="M-58,116 Q-2,112 46,116" stroke-width="1.2" fill="none"/>
      </g>

      <!-- Fitted Corset / Bodice with Sweetheart Neckline -->
      <path d="M-14,-15 C-14,-28 2,-30 14,-26 L16,35 L-14,35 Z" fill="url(#pearlWhiteGown)"/>
      <path d="M-14,-15 C-8,-10 0,-18 2,-18 C4,-18 12,-10 14,-15" stroke="url(#champagneGoldRec)" stroke-width="1" fill="none"/>

      <!-- Bride's Left Hand Resting on Groom's Shoulder in Romantic Dance -->
      <path d="M-14,-12 C-26,-18 -32,-22 -38,-15" stroke="#FCE2CE" stroke-width="6.5" stroke-linecap="round" fill="none"/>
      <circle cx="-38" cy="-14" r="4" fill="#FCE2CE"/>
      <!-- Sonal's Right Hand Intertwined with Groom's -->
      <path d="M12,-10 C22,5 24,20 18,30" stroke="#FCE2CE" stroke-width="6.5" stroke-linecap="round" fill="none"/>

      <!-- Diamond Necklace & Solitaire Ring -->
      <path d="M-8,-26 C-2,-20 4,-20 8,-26" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-dasharray="1.5,1.5"/>
      <circle cx="0" cy="-22" r="2" fill="#FFFFFF"/>

      <!-- Sonal's Elegant Chignon / Updo with Pearl Hairpins -->
      <ellipse cx="0" cy="-56" rx="12" ry="15" fill="#FCE2CE"/>
      <circle cx="10" cy="-62" r="9" fill="#150E07"/>
      <circle cx="6" cy="-66" r="2" fill="#FFFFFF"/>
      <circle cx="12" cy="-64" r="2" fill="#FFFFFF"/>
      <circle cx="14" cy="-58" r="2" fill="#FFFFFF"/>
      
      <!-- Pearl Drop Earring -->
      <circle cx="-8" cy="-52" r="2" fill="#FFFFFF"/>
      <circle cx="-8" cy="-47" r="2.5" fill="#FFFFFF"/>

      <!-- Gentle Romantic Smile Looking at Kunal -->
      <path d="M-7,-54 Q-3,-51 1,-54" stroke="#150E07" stroke-width="1.5" fill="none"/>
      <path d="M-4,-43 Q0,-38 5,-43" stroke="#D63031" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Soft White & Gold Floating Bokeh Particles -->
  <g opacity="0.6">
    <circle cx="100" cy="280" r="4" fill="#FFFFFF" filter="url(#fairyLightBlur)"/>
    <circle cx="390" cy="270" r="5" fill="#FFF2B2" filter="url(#fairyLightBlur)"/>
    <circle cx="140" cy="380" r="6" fill="#FFFFFF" opacity="0.4"/>
    <circle cx="360" cy="390" r="7" fill="#FFF2B2" opacity="0.4"/>
    <circle cx="250" cy="450" r="5" fill="#FFFFFF" opacity="0.5"/>
  </g>
</svg>
