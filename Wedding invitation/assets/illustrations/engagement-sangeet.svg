<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="stageGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#2D1B4E" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#1A102F" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0E081B" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D1"/>
      <stop offset="50%" stop-color="#E5C170"/>
      <stop offset="100%" stop-color="#9C7726"/>
    </linearGradient>
    <linearGradient id="emeraldGlam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="50%" stop-color="#16A085"/>
      <stop offset="100%" stop-color="#0E4B3E"/>
    </linearGradient>
    <linearGradient id="midnightTux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C3A47"/>
      <stop offset="60%" stop-color="#131921"/>
      <stop offset="100%" stop-color="#080C10"/>
    </linearGradient>
    <linearGradient id="spotlight1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9CA24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F9CA24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spotlight2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E056FD" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E056FD" stop-opacity="0"/>
    </linearGradient>
    <filter id="diamondSparkle">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Night Stage Atmosphere Background -->
  <rect x="0" y="0" width="500" height="500" rx="16" fill="url(#stageGlow)"/>

  <!-- Stage Spotlights Cone Beams -->
  <polygon points="50,0 200,450 350,450 150,0" fill="url(#spotlight1)"/>
  <polygon points="450,0 300,450 150,450 350,0" fill="url(#spotlight2)"/>

  <!-- Hanging Crystal Chandeliers & Fairy Lights -->
  <g transform="translate(250, 45)" stroke="url(#champagneGold)" opacity="0.8">
    <line x1="0" y1="0" x2="0" y2="35" stroke-width="1.5"/>
    <ellipse cx="0" cy="35" rx="30" ry="8" fill="none" stroke-width="1.5"/>
    <!-- Crystal pendants -->
    <line x1="-25" y1="35" x2="-25" y2="55" stroke-width="1"/>
    <circle cx="-25" cy="55" r="2.5" fill="#FFFBE6"/>
    <line x1="-12" y1="37" x2="-12" y2="62" stroke-width="1"/>
    <circle cx="-12" cy="62" r="2.5" fill="#FFFBE6"/>
    <line x1="0" y1="38" x2="0" y2="70" stroke-width="1.2"/>
    <polygon points="0,70 -4,78 0,84 4,78" fill="url(#champagneGold)"/>
    <line x1="12" y1="37" x2="12" y2="62" stroke-width="1"/>
    <circle cx="12" cy="62" r="2.5" fill="#FFFBE6"/>
    <line x1="25" y1="35" x2="25" y2="55" stroke-width="1"/>
    <circle cx="25" cy="55" r="2.5" fill="#FFFBE6"/>
  </g>

  <!-- Golden Disco Sparkles & Musical Rhythm Notes in Background -->
  <g fill="url(#champagneGold)" opacity="0.6">
    <!-- Starbursts -->
    <polygon points="80,110 82,102 90,100 82,98 80,90 78,98 70,100 78,102" filter="url(#diamondSparkle)"/>
    <polygon points="420,120 422,112 430,110 422,108 420,100 418,108 410,110 418,112" filter="url(#diamondSparkle)"/>
    <polygon points="120,220 121,215 126,214 121,213 120,208 119,213 114,214 119,215"/>
    <polygon points="380,210 381,205 386,204 381,203 380,198 379,203 374,204 379,205"/>
    <!-- Musical notes -->
    <path d="M100,160 L100,140 L115,135 L115,155 M100,160 A4,3 0 1,1 92,160 A4,3 0 1,1 100,160 M115,155 A4,3 0 1,1 107,155 A4,3 0 1,1 115,155" stroke="url(#champagneGold)" stroke-width="1.5" fill="url(#champagneGold)"/>
    <path d="M400,170 L400,150 L412,145 L412,165 M400,170 A3,2.5 0 1,1 394,170 A3,2.5 0 1,1 400,170 M412,165 A3,2.5 0 1,1 406,165 A3,2.5 0 1,1 412,165" stroke="url(#champagneGold)" stroke-width="1.5" fill="url(#champagneGold)"/>
  </g>

  <!-- Glamorous Couple: Kunal & Sonal Raising a Toast / Dancing -->
  <g id="sangeetCouple" transform="translate(250, 315)">
    <!-- Stage Reflection Shadow -->
    <ellipse cx="0" cy="120" rx="95" ry="14" fill="#05030A" opacity="0.6"/>

    <!-- GROOM (KUNAL) - Sharp Midnight Black / Velvet Indo-Western Tuxedo -->
    <g transform="translate(-42, -5)">
      <!-- Slim Fit Trousers -->
      <path d="M-20,45 L-24,118 L-8,118 L-6,45 Z" fill="url(#midnightTux)"/>
      <path d="M-4,45 L-2,118 L14,118 L10,45 Z" fill="url(#midnightTux)"/>
      <!-- Polished Dress Shoes -->
      <path d="M-26,118 C-28,122 -10,122 -8,118 Z" fill="#000000"/>
      <path d="M-4,118 C-2,122 16,122 14,118 Z" fill="#000000"/>

      <!-- Asymmetric Bandhgala / Tuxedo Jacket with Gold Piping -->
      <path d="M-26,-22 C-26,-30 -8,-34 2,-34 C12,-34 24,-26 24,-22 L20,48 L-22,48 Z" fill="url(#midnightTux)"/>
      <line x1="2" y1="-34" x2="-8" y2="48" stroke="url(#champagneGold)" stroke-width="1.5"/>
      <!-- Gold Brooch / Lapel Pin with Hanging Chain -->
      <circle cx="-14" cy="-14" r="3" fill="url(#champagneGold)"/>
      <path d="M-14,-14 Q-8,-4 -2,-10" stroke="url(#champagneGold)" stroke-width="0.8" fill="none"/>

      <!-- Raised Right Arm holding Crystal Champagne Flute -->
      <path d="M22,-18 C35,-30 42,-50 38,-70" stroke="url(#midnightTux)" stroke-width="9" stroke-linecap="round" fill="none"/>
      <!-- Hand & Glass -->
      <circle cx="38" cy="-73" r="4.5" fill="#F7D0B7"/>
      <!-- Champagne Flute Glass with Bubbly Liquid -->
      <polygon points="34,-95 44,-95 40,-80 38,-80" fill="#E4C175" opacity="0.8"/>
      <line x1="39" y1="-80" x2="39" y2="-72" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="35" y1="-72" x2="43" y2="-72" stroke="#FFFFFF" stroke-width="1.5"/>
      <circle cx="39" cy="-88" r="1" fill="#FFFFFF"/>
      <circle cx="41" cy="-84" r="0.8" fill="#FFFFFF"/>

      <!-- Groom Head & Confident Expression -->
      <ellipse cx="-2" cy="-58" rx="13" ry="16" fill="#F7D0B7"/>
      <path d="M-15,-66 C-14,-78 4,-76 12,-70 C2,-70 -6,-64 -6,-54 Z" fill="#1C130B"/>
      <!-- Styled Beard -->
      <path d="M-14,-56 C-14,-48 -7,-42 0,-42 C7,-42 12,-48 12,-56 C8,-46 0,-46 -2,-46 C-7,-46 -12,-48 -14,-56 Z" fill="#1C130B"/>
      <!-- Diamond Stud in Ear -->
      <circle cx="-13" cy="-56" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- BRIDE (SONAL) - Dazzling Emerald Green Sequined Contemporary Gown / Lehenga -->
    <g transform="translate(42, 0)">
      <!-- Mermaid Silhouette Skirt / Draped Sequined Flair -->
      <path d="M-18,35 C-22,65 -35,95 -45,118 C-45,122 38,122 38,118 C28,95 18,65 14,35 Z" fill="url(#emeraldGlam)"/>
      <!-- Shimmering Sequins Overlay Texture -->
      <g stroke="url(#champagneGold)" stroke-width="0.8" opacity="0.6">
        <path d="M-22,60 Q-2,55 18,60" fill="none"/>
        <path d="M-28,80 Q-2,75 24,80" fill="none"/>
        <path d="M-36,100 Q-2,95 32,100" fill="none"/>
        <path d="M-42,116 Q-2,112 36,116" stroke-width="1.5" fill="none"/>
      </g>

      <!-- Fitted Glamour Blouse / Modern Cut Bodice -->
      <path d="M-15,-16 C-15,-28 2,-30 14,-26 L16,35 L-14,35 Z" fill="url(#emeraldGlam)"/>
      <line x1="-15" y1="-16" x2="14" y2="-26" stroke="url(#champagneGold)" stroke-width="1.5"/>

      <!-- Left Hand Raising Clinking Champagne Flute to Groom -->
      <path d="M-14,-15 C-28,-28 -35,-48 -32,-68" stroke="#FCE2CE" stroke-width="6.5" stroke-linecap="round" fill="none"/>
      <circle cx="-32" cy="-71" r="4" fill="#FCE2CE"/>
      
      <!-- Champagne Flute Clinking (Sparkle Burst between glasses) -->
      <polygon points="-36,-93 -26,-93 -30,-78 -32,-78" fill="#E4C175" opacity="0.8"/>
      <line x1="-31" y1="-78" x2="-31" y2="-70" stroke="#FFFFFF" stroke-width="1.5"/>
      <line x1="-35" y1="-70" x2="-27" y2="-70" stroke="#FFFFFF" stroke-width="1.5"/>

      <!-- Sparkling Diamond Engagement Ring on Sonal's Finger! -->
      <g transform="translate(-30, -70)" filter="url(#diamondSparkle)">
        <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
        <polygon points="0,-6 1.5,-2 5,0 1.5,2 0,6 -1.5,2 -5,0 -1.5,-2" fill="#FFFFFF"/>
        <circle cx="0" cy="0" r="4" fill="#FFF2B2" opacity="0.4"/>
      </g>

      <!-- Bride Hair: Elegant Hollywood Waves with Emerald Drop Earrings -->
      <ellipse cx="2" cy="-56" rx="12" ry="15" fill="#FCE2CE"/>
      <path d="M-10,-62 C-8,-76 12,-72 16,-60 C20,-48 22,-20 18,10 Z" fill="#1C130B"/>
      <!-- Emerald & Diamond Drop Earring -->
      <circle cx="-8" cy="-52" r="1.5" fill="#FFFFFF"/>
      <polygon points="-8,-48 -6,-42 -10,-42" fill="#2ECC71"/>
      <circle cx="-8" cy="-40" r="1.2" fill="#FFFFFF"/>

      <!-- Sonal's Glamorous Party Makeup & Smile -->
      <path d="M-5,-56 Q-1,-53 3,-56" stroke="#2C1D11" stroke-width="1.5" fill="none"/>
      <path d="M-2,-44 Q2,-38 8,-44" stroke="#E84118" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Clinking Cheers Sparkle Effect in the Center -->
  <g transform="translate(254, 235)" filter="url(#diamondSparkle)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="7" fill="#FFEAA7" opacity="0.5"/>
  </g>

  <!-- Golden Stage Light Flare Base -->
  <ellipse cx="250" cy="460" rx="180" ry="20" fill="url(#champagneGold)" opacity="0.15"/>
</svg>
