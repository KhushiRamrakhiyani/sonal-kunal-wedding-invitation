<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <linearGradient id="archGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B4B" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#E5C170" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFF2CA" stop-opacity="1"/>
      <stop offset="70%" stop-color="#E5C170" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C59B4B" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="blushPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="100%" stop-color="#F48FB1"/>
    </linearGradient>
    <linearGradient id="sageStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5D6A7"/>
      <stop offset="100%" stop-color="#66BB6A"/>
    </linearGradient>
  </defs>

  <!-- Flowing Botanical Arch Ribbon -->
  <path d="M20,180 Q300,-40 580,180" stroke="url(#archGoldGrad)" stroke-width="2.5" fill="none"/>
  <path d="M40,180 Q300,-15 560,180" stroke="url(#archGoldGrad)" stroke-width="1.2" stroke-dasharray="6,4" fill="none"/>

  <!-- Botanical Flowers & Foliage on the Arch -->
  <!-- Center Apex Flower -->
  <g transform="translate(300, 32)">
    <circle cx="0" cy="0" r="14" fill="url(#blushPetal)"/>
    <circle cx="0" cy="0" r="7" fill="#F8BBD0"/>
    <circle cx="0" cy="0" r="3" fill="#D4AF37"/>
    <!-- Petals -->
    <circle cx="-16" cy="-2" r="8" fill="url(#blushPetal)" opacity="0.85"/>
    <circle cx="16" cy="-2" r="8" fill="url(#blushPetal)" opacity="0.85"/>
    <circle cx="0" cy="-16" r="8" fill="url(#blushPetal)" opacity="0.85"/>
    <circle cx="0" cy="14" r="7" fill="url(#blushPetal)" opacity="0.85"/>
    <!-- Leaves -->
    <path d="M-28,-10 C-38,-20 -35,-30 -25,-20 Z" fill="url(#sageStem)"/>
    <path d="M28,-10 C38,-20 35,-30 25,-20 Z" fill="url(#sageStem)"/>
  </g>

  <!-- Left Side Flowers -->
  <g transform="translate(180, 68)">
    <circle cx="0" cy="0" r="10" fill="url(#blushPetal)"/>
    <circle cx="0" cy="0" r="4" fill="#D4AF37"/>
    <circle cx="-12" cy="0" r="6" fill="#F8BBD0"/>
    <circle cx="12" cy="0" r="6" fill="#F8BBD0"/>
  </g>
  <g transform="translate(100, 120)">
    <circle cx="0" cy="0" r="9" fill="url(#blushPetal)"/>
    <circle cx="0" cy="0" r="3.5" fill="#D4AF37"/>
  </g>

  <!-- Right Side Flowers -->
  <g transform="translate(420, 68)">
    <circle cx="0" cy="0" r="10" fill="url(#blushPetal)"/>
    <circle cx="0" cy="0" r="4" fill="#D4AF37"/>
    <circle cx="-12" cy="0" r="6" fill="#F8BBD0"/>
    <circle cx="12" cy="0" r="6" fill="#F8BBD0"/>
  </g>
  <g transform="translate(500, 120)">
    <circle cx="0" cy="0" r="9" fill="url(#blushPetal)"/>
    <circle cx="0" cy="0" r="3.5" fill="#D4AF37"/>
  </g>
</svg>
