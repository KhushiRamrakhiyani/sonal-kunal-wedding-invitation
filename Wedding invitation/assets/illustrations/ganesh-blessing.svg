<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="divineGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFF8E7" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FCEFD2" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#EED59B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EED59B" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="ganeshGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBC2"/>
      <stop offset="35%" stop-color="#DEB059"/>
      <stop offset="70%" stop-color="#B88628"/>
      <stop offset="100%" stop-color="#805611"/>
    </linearGradient>

    <linearGradient id="marigoldRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F96D43"/>
      <stop offset="100%" stop-color="#C72C18"/>
    </linearGradient>

    <linearGradient id="lotusPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE8EE"/>
      <stop offset="50%" stop-color="#F5B2C4"/>
      <stop offset="100%" stop-color="#D9658B"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#8C6219" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Divine Aura / Sunburst Rays -->
  <circle cx="200" cy="180" r="140" fill="url(#divineGlow)"/>
  
  <g stroke="url(#ganeshGold)" stroke-width="0.75" opacity="0.4">
    <line x1="200" y1="30" x2="200" y2="70"/>
    <line x1="200" y1="290" x2="200" y2="330"/>
    <line x1="50" y1="180" x2="90" y2="180"/>
    <line x1="310" y1="180" x2="350" y2="180"/>
    <line x1="94" y1="74" x2="124" y2="104"/>
    <line x1="276" y1="256" x2="306" y2="286"/>
    <line x1="94" y1="286" x2="124" y2="256"/>
    <line x1="276" y1="104" x2="306" y2="74"/>
  </g>

  <!-- Ornate Halo Ring -->
  <circle cx="200" cy="180" r="115" fill="none" stroke="url(#ganeshGold)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <circle cx="200" cy="180" r="122" fill="none" stroke="url(#ganeshGold)" stroke-width="0.8" opacity="0.4"/>

  <!-- Lotus Throne Base -->
  <g id="lotusThrone" transform="translate(200, 310)" filter="url(#softShadow)">
    <!-- Back Lotus Petals -->
    <path d="M-80,-10 C-60,-40 -20,-45 0,-15 C20,-45 60,-40 80,-10 C60,5 20,10 0,10 C-20,10 -60,5 -80,-10 Z" fill="url(#lotusPink)" opacity="0.7"/>
    <!-- Middle Petals -->
    <path d="M-60,-5 C-40,-35 -10,-40 0,-10 C10,-40 40,-35 60,-5 C45,12 15,15 0,15 C-15,15 -45,12 -60,-5 Z" fill="url(#lotusPink)"/>
    <!-- Front Petal Accent -->
    <path d="M-30,0 C-15,-25 0,-30 0,-5 C0,-30 15,-25 30,0 C20,15 0,18 0,18 C0,18 -20,15 -30,0 Z" fill="#FFF0F5"/>
    <circle cx="0" cy="5" r="4" fill="url(#ganeshGold)"/>
  </g>

  <!-- Lord Ganesh Ji Figure (Stylized Contemporary Royal Line & Watercolor Art) -->
  <g id="ganeshJi" filter="url(#softShadow)">
    <!-- Ears -->
    <!-- Left Ear (Large, Auspicious) -->
    <path d="M150,150 C110,135 85,160 90,195 C95,225 130,225 152,210 Z" fill="url(#ganeshGold)" opacity="0.9"/>
    <path d="M145,160 C115,150 100,170 105,195 C110,215 130,215 145,200 Z" fill="#FFF2D6" opacity="0.6"/>
    <!-- Right Ear -->
    <path d="M250,150 C290,135 315,160 310,195 C305,225 270,225 248,210 Z" fill="url(#ganeshGold)" opacity="0.9"/>
    <path d="M255,160 C285,150 300,170 295,195 C290,215 270,215 255,200 Z" fill="#FFF2D6" opacity="0.6"/>

    <!-- Head & Brow -->
    <path d="M150,160 C150,125 170,110 200,110 C230,110 250,125 250,160 C250,180 240,195 230,205 C215,220 185,220 170,205 C160,195 150,180 150,160 Z" fill="url(#ganeshGold)"/>

    <!-- Trunk (S-Curve to the left, blessing gesture) -->
    <path d="M188,185 
             C188,220 195,250 175,270 
             C160,285 135,275 140,255 
             C143,245 155,250 152,258 
             C150,265 160,270 168,262 
             C180,248 175,225 175,185 
             Z" 
          fill="url(#ganeshGold)"/>

    <!-- Sacred Tilak / Trishul / Chandan Tika on Forehead -->
    <path d="M194,130 C194,118 206,118 206,130 C206,145 201,152 200,158 C199,152 194,145 194,130 Z" fill="url(#marigoldRed)"/>
    <path d="M185,138 C195,142 205,142 215,138" stroke="url(#marigoldRed)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="200" cy="148" r="3" fill="#FFEAA7"/>

    <!-- Auspicious Eyes -->
    <path d="M168,162 C174,158 182,160 185,166" stroke="#5D3A07" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="178" cy="167" r="1.5" fill="#5D3A07"/>
    <path d="M232,162 C226,158 218,160 215,166" stroke="#5D3A07" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="222" cy="167" r="1.5" fill="#5D3A07"/>

    <!-- Tusk (Ekdanta) -->
    <path d="M214,198 L222,205 L214,203 Z" fill="#FFFFFF"/>

    <!-- Royal Mukut (Crown) -->
    <g transform="translate(200, 110)">
      <path d="M-36,0 C-36,-25 -20,-50 0,-65 C20,-50 36,-25 36,0 Z" fill="url(#ganeshGold)"/>
      <path d="M-28,-2 C-20,-20 0,-42 0,-42 C0,-42 20,-20 28,-2 Z" fill="#FFE8A3" opacity="0.6"/>
      <!-- Crown Jewel -->
      <polygon points="0,-48 6,-38 0,-28 -6,-38" fill="url(#marigoldRed)"/>
      <circle cx="0" cy="-68" r="4" fill="url(#ganeshGold)"/>
      <!-- Crown Base Filigree -->
      <path d="M-38,2 Q0,-6 38,2" stroke="#FFFFFF" stroke-width="2" fill="none"/>
      <circle cx="-25" cy="0" r="2.5" fill="url(#marigoldRed)"/>
      <circle cx="0" cy="-2" r="3" fill="url(#marigoldRed)"/>
      <circle cx="25" cy="0" r="2.5" fill="url(#marigoldRed)"/>
    </g>

    <!-- Modak / Ladoo in Hand / Trunk Tip -->
    <g transform="translate(142, 256)">
      <circle cx="0" cy="0" r="7" fill="#FFC048"/>
      <circle cx="-2" cy="-2" r="2" fill="#FFEAA7"/>
      <circle cx="2" cy="2" r="1.5" fill="#E58E26"/>
    </g>

    <!-- Blessing Hand (Abhaya Mudra on Right) -->
    <g transform="translate(248, 220)">
      <path d="M0,0 C10,-5 20,5 15,20 C10,28 0,30 -5,22 C-10,14 -5,5 0,0 Z" fill="url(#ganeshGold)"/>
      <!-- Auspicious Om symbol or Red Tika on palm -->
      <circle cx="6" cy="14" r="3" fill="url(#marigoldRed)"/>
    </g>
  </g>

  <!-- Sacred Mantra Verse Ribbon at Bottom -->
  <text x="200" y="365" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="12.5" font-weight="700" letter-spacing="4" fill="url(#ganeshGold)">
    ॥ श्री गणेशाय नमः ॥
  </text>
  <text x="200" y="384" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="500" letter-spacing="2.5" fill="#8C6219" opacity="0.8">
    SHREE GANESHAYA NAMAH
  </text>
</svg>
